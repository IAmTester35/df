<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Season - AI OCR</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --glass: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            text-align: center;
            background: linear-gradient(to right, #6366f1, #a855f7, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        #drop-zone {
            flex: 1;
            min-height: 300px;
            border: 2px dashed var(--border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
        }

        #drop-zone:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        #drop-zone.dragging {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
            transform: scale(1.02);
        }

        #preview {
            max-width: 100%;
            max-height: 280px;
            display: none;
            border-radius: 8px;
            object-fit: contain;
        }

        .placeholder-text {
            color: #64748b;
            text-align: center;
            pointer-events: none;
        }

        textarea {
            flex: 1;
            min-height: 300px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.25rem;
            color: #e2e8f0;
            font-size: 1rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        input[type="file"] {
            display: none;
        }

        .credits {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.8rem;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chat Season</h1>
        
        <div class="grid">
            <!-- Left: Input Area -->
            <div class="card">
                <span class="label">Gửi hình ảnh</span>
                <div id="drop-zone" onclick="document.getElementById('file-input').click()">
                    <div class="placeholder-text" id="drop-text">
                        <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                        <p style="margin-top: 10px;">Kéo thả, click hoặc **Ctrl+V** để dán ảnh</p>
                    </div>
                    <img id="preview" alt="Preview">
                </div>
                <input type="file" id="file-input" accept="image/*">
                <button class="btn" id="process-btn" disabled>
                    <div class="loading-spinner" id="spinner"></div>
                    <span id="btn-text">Phân tích tin nhắn ảnh</span>
                </button>
            </div>

            <!-- Right: Output Area -->
            <div class="card">
                <span class="label">Nội dung nhận diện</span>
                <textarea id="output-text" readonly placeholder="Kết quả sẽ hiển thị ở đây như một tin nhắn..."></textarea>
            </div>
        </div>

        <div class="credits">
            Chat Season v1.0 • Powered by AI OCR
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const dropText = document.getElementById('drop-text');
        const processBtn = document.getElementById('process-btn');
        const outputText = document.getElementById('output-text');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btn-text');

        let selectedFile = null;

        // Handle File Selection
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        };

        // Handle Drag & Drop
        dropZone.ondragover = (e) => {
            e.preventDefault();
            dropZone.classList.add('dragging');
        };

        dropZone.ondragleave = () => {
            dropZone.classList.remove('dragging');
        };

        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragging');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        };

        // Handle Paste (Ctrl+V)
        window.addEventListener('paste', (e) => {
            console.log("Paste event detected");
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            const files = (e.clipboardData || e.originalEvent.clipboardData).files;

            // Check files first
            if (files && files.length > 0) {
                for (let i = 0; i < files.length; i++) {
                    if (files[i].type.startsWith('image/')) {
                        console.log("Image found in files");
                        handleFile(files[i]);
                        return;
                    }
                }
            }

            // Then check items
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    console.log("Image found in items");
                    const blob = item.getAsFile();
                    handleFile(blob);
                    return;
                }
            }
        });

        function handleFile(file) {
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                dropText.style.display = 'none';
                processBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }

        // Handle OCR Process
        processBtn.onclick = async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('image', selectedFile);

            // UI State
            processBtn.disabled = true;
            spinner.style.display = 'block';
            btnText.innerText = 'Đang xử lý...';
            outputText.value = 'Đang nhận diện văn bản...';

            try {
                const response = await fetch('/ocr', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    outputText.value = data.text || 'Không tìm thấy văn bản.';
                    if (!data.text) outputText.value = 'Không tìm thấy văn bản nào trong hình.';
                } else {
                    outputText.value = 'Lỗi: ' + data.error;
                }
            } catch (error) {
                outputText.value = 'Lỗi kết nối server.';
                console.error(error);
            } finally {
                processBtn.disabled = false;
                spinner.style.display = 'none';
                btnText.innerText = 'Phân tích tin nhắn ảnh';
            }
        };
    </script>
</body>
</html>
